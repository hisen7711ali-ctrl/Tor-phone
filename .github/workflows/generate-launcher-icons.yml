name: Generate legacy launcher icons

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/icon/ic_launcher.svg'
      - 'tools/generate_launcher_pngs.py'
      - '.github/workflows/generate-launcher-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion tools
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Generate PNGs from vector source
        run: python tools/generate_launcher_pngs.py
      - name: Commit generated density assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/mipmap-*/ic_launcher.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate legacy launcher icon density assets [skip ci]"
          git push origin HEAD:main
