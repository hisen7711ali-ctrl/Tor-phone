name: Android debug APK

on:
  workflow_run:
    workflows: ["Build Onionmasq native libraries"]
    types: [completed]
    branches: [ main ]

permissions:
  actions: read
  contents: read

jobs:
  debug-build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Onionmasq JNI libraries
        uses: actions/download-artifact@v4
        with:
          name: onionmasq-jni-libs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: app/src/main/jniLibs

      - name: Verify native libraries
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libonionmasq_mobile.so
          test -s app/src/main/jniLibs/armeabi-v7a/libonionmasq_mobile.so
          file app/src/main/jniLibs/*/libonionmasq_mobile.so

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug APK with Onionmasq
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tor-phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
