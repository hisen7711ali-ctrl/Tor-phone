name: Android release and debug builds

on:
  workflow_run:
    workflows: ["Build Onionmasq native libraries"]
    types: [completed]
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
      - 'README.md'
      - 'tools/icon/**'
      - 'tools/generate_launcher_pngs.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  android-build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive

      - name: Download Onionmasq JNI libraries
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: onionmasq-jni-libs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: app/src/main/jniLibs

      - name: Verify native libraries
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libonionmasq_mobile.so
          test -s app/src/main/jniLibs/armeabi-v7a/libonionmasq_mobile.so
          file app/src/main/jniLibs/*/libonionmasq_mobile.so

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate launcher PNG density assets
        run: |
          python3 -m pip install --user cairosvg pillow
          python3 tools/generate_launcher_pngs.py

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify and report ABI debug APKs
        run: |
          test -s app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -s app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          stat -c '%n %s bytes' app/build/outputs/apk/debug/app-arm64-v8a-debug.apk app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Publish directly downloadable signed debug APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "tor-phone-debug-${GITHUB_SHA}" \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
            --title "Tor-phone signed debug APKs ${GITHUB_SHA::7}" \
            --prerelease \
            --notes "ABI-split debug APKs built and auto-signed with the Android debug keystore."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tor-phone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Assemble ABI-split release APKs and AAB
        if: ${{ !contains(github.event.head_commit.message, '[debug-only]') }}
        continue-on-error: true
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: List release outputs and sizes
        run: |
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -printf '%f %s bytes\\n' || true
          find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -printf '%f %s bytes\\n' || true

      - name: Upload APK and AAB artifacts
        if: ${{ hashFiles('app/build/outputs/apk/release/*.apk', 'app/build/outputs/bundle/release/*.aab') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tor-phone-release-apks-and-aab
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
