name: Build Onionmasq native libraries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onionmasq-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    name: Build Android native libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned Onionmasq source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK r27d
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android NDK r27d
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Set up Rust 1.91.0
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Install Rust formatting component
        run: rustup component add rustfmt

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build arm64-v8a and armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail
          cd third_party/onionmasq/vendor
          # The pinned helper checks an older NDK directory name; align that
          # check with the r27d toolchain used by the F-Droid reference build.
          sed -i 's/EXPECTED_NDK_VERSION="25.2.9519653"/EXPECTED_NDK_VERSION="27.3.13750724"/' build-ndk.sh
          # Build release libraries even when selecting one ABI at a time.
          sed -i 's/  RELEASE="debug"/  RELEASE="release"/; s/  RELEASEFLAG=$/  RELEASEFLAG="--release"/' build-ndk.sh
          ./build-ndk.sh arm64-v8a
          ./build-ndk.sh armeabi-v7a
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          install -m 0644 third_party/onionmasq/vendor/build/arm64-v8a/libonionmasq_mobile.so app/src/main/jniLibs/arm64-v8a/
          install -m 0644 third_party/onionmasq/vendor/build/armeabi-v7a/libonionmasq_mobile.so app/src/main/jniLibs/armeabi-v7a/
          file app/src/main/jniLibs/*/libonionmasq_mobile.so

      - name: Upload JNI libraries
        uses: actions/upload-artifact@v4
        with:
          name: onionmasq-jni-libs
          path: app/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 14
