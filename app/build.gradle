plugins { id 'com.android.application' }

android {
    namespace 'org.torphone.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.torphone.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'none'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':onionmasq')
}
